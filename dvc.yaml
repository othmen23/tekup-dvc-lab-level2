stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - data/iris.csv
    - src/prepare.py
    params:
    - prepare.seed
    - prepare.test_size
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train:
    cmd: python src/train.py
    deps:
    - data/processed/train.csv
    - src/train.py
    params:
    - train.max_depth
    - train.n_estimators
    - train.seed
    outs:
    - models/model.pkl
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed/test.csv
    - models/model.pkl
    - src/evaluate.py
    metrics:
    - metrics/metrics.json:
        cache: false
